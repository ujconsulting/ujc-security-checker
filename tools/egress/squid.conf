# Egress proxy for sandbox containers (ujc-security-checker)
# Sandbox containers are attached only to the internal Docker network ujc-sandbox-net (--internal,
# no exit) and reach the internet exclusively through this proxy.
# Rules:
#  - private, local and special-purpose networks are ALWAYS blocked (LAN services, NAS, Docker host, other containers)
#  - only the domains of the active list are allowed (setup.sh assembles it from allowlist*.txt)
#  - every request is logged (access.log) - evidence of where an install script wanted to go

http_port 3128

# Clients: only the subnet of ujc-sandbox-net (setup.sh writes clients.txt). The proxy also has a
# leg in the default bridge network for its own exit - containers there must not use it.
acl sandbox_clients src "/etc/squid/ujc/clients.txt"
acl to_private dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
acl to_private dst ::1 fc00::/7 fe80::/10
acl allowed_domains dstdomain "/etc/squid/ujc/allowlist.txt"
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
# package sources and vulnerability databases only need to read; HTTPS goes through CONNECT
acl read_methods method GET HEAD CONNECT

http_access deny !sandbox_clients
http_access deny to_private
http_access deny !Safe_ports
http_access deny !read_methods
http_access deny CONNECT !SSL_ports
http_access allow allowed_domains
http_access deny all

# no cache, no forwarding of internal headers
cache deny all
forwarded_for delete
via off

logformat ujc %tl %>a %Ss/%>Hs %rm %ru %<a
access_log stdio:/var/log/squid/access.log ujc
cache_log stdio:/var/log/squid/cache.log
pid_filename /run/squid.pid
coredump_dir /tmp
# the ICMP pinger needs privileges the container deliberately does not have
pinger_enable off
